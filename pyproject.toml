# Tooling for the release scripts in scripts/. Not a package: the app is Swift.
[project]
name = "healthexporter-scripts"
version = "0.0.0"
description = "Release and CI scripts for HealthExporter"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.10.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["scripts", "scripts/tests"]
# Python lives in scripts/ only. Ruff also formats Markdown; the docs are not
# its business.
include = ["scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["scripts"]
mypy_path = ["scripts", "scripts/tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]
addopts = "-ra"
