name: TestFlight Upload

# bump-build-number.yml dispatches this workflow on the new tag after every
# merge to main. Dispatch it by hand to rebuild a ref or to dry-run signing.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit SHA to build (defaults to current ref)"
        required: false
      upload:
        description: "Upload to TestFlight (false = test, archive and export only: a dry run of signing)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: testflight-upload-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    name: Test, archive, and upload to TestFlight
    runs-on: [self-hosted, macOS, ARM64]
    # A hung simulator must not hold the shared runner for the 6-hour default.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Check required secrets
        env:
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=0
          for name in MACOS_KEYCHAIN_PASSWORD ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run iOS tests
        run: ci/run_ios_tests.sh "$RUNNER_TEMP/TestFlightTestResults.xcresult"

      # The same screenshots as ios-tests.yml, from the release tag, so they
      # show the release's version number. appstore-screenshots.yml takes them
      # from the newest successful run of this workflow on the tag.
      - name: Export screenshots
        if: ${{ !cancelled() }}
        run: ci/export_screenshots.sh "$RUNNER_TEMP/TestFlightTestResults.xcresult" "$RUNNER_TEMP/screenshots"

      # 3 days, the most any artifact keeps (Evan, 2026-10-27). For a later
      # App Store upload, a dry run on the tag makes a new set
      # (docs/app-store-release.md).
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 3

      - name: Unlock signing keychain
        env:
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          if [ ! -f "$KEYCHAIN" ]; then
            echo "::error::Login keychain not found at $KEYCHAIN"
            exit 1
          fi
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Keep the keychain unlocked for the duration of the job; default
          # locks on sleep or after a short timeout, which can break long builds.
          security set-keychain-settings -lut 7200 "$KEYCHAIN"

      - name: Stage App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/asc_private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_DIR=$KEY_DIR" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Fails in seconds when the profile is missing, before the long archive.
      - name: Install App Store profile
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: xcrun swift ci/install_profile.swift "HealthExporter App Store"

      - name: Archive
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project HealthExporter.xcodeproj \
            -scheme HealthExporter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HealthExporter.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=94S5PZTVPY

      - name: Export IPA
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HealthExporter.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

      - name: Upload IPA for Internal TestFlight
        if: ${{ inputs.upload }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ env.ASC_KEY_DIR }}
        run: |
          set -euo pipefail
          IPA_PATH=$(/usr/bin/find "$RUNNER_TEMP/export" -maxdepth 2 -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa produced by exportArchive"
            exit 1
          fi
          echo "Uploading $IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Set up uv
        if: ${{ inputs.upload }}
        uses: astral-sh/setup-uv@v10.3.0
        # The runner is shared: keep the uv cache to this run.
        with:
          cache-local-path: ${{ runner.temp }}/uv-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Read the build version
        id: version
        if: ${{ inputs.upload }}
        # Fails when the project's version entries disagree.
        run: uv run --frozen scripts/check_version.py --github-output "$GITHUB_OUTPUT"

      # Target the build just uploaded, never "latest": App Store Connect lists
      # a new upload only after a delay, and "latest" can then resolve to the
      # previous build and rewrite its notes. Retry while ASC indexes it.
      # Build numbers repeat across versions, so pass the version too.
      - name: Set TestFlight "What to Test" notes
        if: ${{ inputs.upload }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ env.ASC_KEY_PATH }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The notes are the version's section in docs/changelog.md. A tag
          # cut before the changelog has none: warn and upload with no notes.
          notes="$RUNNER_TEMP/testflight-notes.md"
          if ! uv run --frozen scripts/changelog.py \
                 notes --version "$APP_VERSION" --output "$notes"; then
            echo "::warning::docs/changelog.md has no notes for v$APP_VERSION; the build has no notes."
            exit 0
          fi
          for attempt in $(seq 1 10); do
            if uv run --frozen scripts/update_testflight_notes.py \
                 --build "$BUILD_NUMBER" \
                 --app-version "$APP_VERSION" \
                 --notes-file "$notes"; then
              exit 0
            fi
            echo "Build $BUILD_NUMBER ($APP_VERSION) is not in App Store Connect yet (attempt $attempt/10); retrying in 30 s"
            sleep 30
          done
          echo "::error::Could not set the TestFlight notes for build $BUILD_NUMBER ($APP_VERSION)"
          exit 1

      - name: Clean up API key and lock the keychain
        if: always()
        run: |
          if [ -n "${ASC_KEY_DIR:-}" ] && [ -d "$ASC_KEY_DIR" ]; then
            rm -rf "$ASC_KEY_DIR"
          fi
          # The unlock step keeps the keychain open for 2 hours. Restore the
          # default lock settings and lock it now, so the shared runner's
          # keychain does not stay open after the job.
          KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          security set-keychain-settings "$KEYCHAIN" || true
          security lock-keychain "$KEYCHAIN" || true
