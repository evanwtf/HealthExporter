# Fallback for tags pushed by hand. After a merge to main, bump-build-number.yml
# creates the release itself: its GITHUB_TOKEN tag push does not trigger this.
name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here: name the repo so gh ignores the reused workspace.
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists"
            exit 0
          fi

          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes
