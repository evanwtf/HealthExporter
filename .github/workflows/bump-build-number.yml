name: Bump Build Number

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  bump:
    name: Increment CURRENT_PROJECT_VERSION
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # Labels on the merged PR choose the version part: `semver:major` or
      # `semver:minor` (layout changes); no label bumps the patch.
      - name: Bump build number and version
        env:
          BUMP_MAJOR: ${{ contains(github.event.pull_request.labels.*.name, 'semver:major') }}
          BUMP_MINOR: ${{ contains(github.event.pull_request.labels.*.name, 'semver:minor') }}
        run: |
          FILE="HealthExporter.xcodeproj/project.pbxproj"

          # Bump CURRENT_PROJECT_VERSION (build number)
          CURRENT=$(grep -m1 'CURRENT_PROJECT_VERSION' "$FILE" | sed 's/[^0-9]//g')
          NEXT=$((CURRENT + 1))
          echo "Bumping build number: $CURRENT -> $NEXT"
          sed -i "s/CURRENT_PROJECT_VERSION = $CURRENT;/CURRENT_PROJECT_VERSION = $NEXT;/g" "$FILE"
          grep 'CURRENT_PROJECT_VERSION' "$FILE"

          # Bump MARKETING_VERSION: 2.4.6 -> 2.4.7, 2.5.0 (semver:minor) or 3.0.0 (semver:major)
          MARKETING=$(grep -m1 'MARKETING_VERSION' "$FILE" | sed 's/.*= //;s/;.*//')
          MAJOR=$(echo "$MARKETING" | cut -d. -f1)
          MINOR=$(echo "$MARKETING" | cut -d. -f2)
          PATCH=$(echo "$MARKETING" | cut -d. -f3)
          if [ "$BUMP_MAJOR" = "true" ]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif [ "$BUMP_MINOR" = "true" ]; then
            NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
          else
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "Bumping marketing version: $MARKETING -> $NEW_VERSION"
          sed -i "s/MARKETING_VERSION = $MARKETING;/MARKETING_VERSION = $NEW_VERSION;/g" "$FILE"
          grep 'MARKETING_VERSION' "$FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add HealthExporter.xcodeproj/project.pbxproj
          BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION' HealthExporter.xcodeproj/project.pbxproj | sed 's/[^0-9]//g')
          VERSION=$(grep -m1 'MARKETING_VERSION' HealthExporter.xcodeproj/project.pbxproj | sed 's/.*= //;s/;.*//')
          git commit -m "Bump version to $VERSION (build $BUILD) [skip ci]"
          git push

      - name: Tag release
        id: tag
        run: |
          FILE="HealthExporter.xcodeproj/project.pbxproj"
          TAG="v$(grep -m1 'MARKETING_VERSION' "$FILE" | sed 's/[^0-9.]//g')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists"
            exit 0
          fi

          # The self-hosted workspace is reused: drop a stale local tag from a failed run.
          git tag -d "$TAG" 2>/dev/null || true
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      # A tag pushed with GITHUB_TOKEN does not trigger other workflows, so this
      # job creates the release and starts the TestFlight upload itself.
      # A workflow_dispatch made with GITHUB_TOKEN does create a run.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

      - name: Start TestFlight upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run release-testflight.yml --ref "$TAG"
