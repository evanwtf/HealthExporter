# Fallback for tags pushed by hand. After a merge to main, bump-build-number.yml
# creates the release itself. Its tag push starts this workflow only when it
# pushes with the RELEASE_DEPLOY_KEY deploy key; then both jobs may try to
# create the release, and the one that loses the race exits 0.
name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here: name the repo so gh ignores the reused workspace.
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists"
            exit 0
          fi

          if ! gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes; then
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "Release $TAG_NAME was created by another job"
              exit 0
            fi
            exit 1
          fi
